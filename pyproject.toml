[project]
name = "residuos"
version = "0.1.0"
description = "Clasificador de residuos por material con traducción a la caneca de la Resolución 2184 de 2019"
requires-python = ">=3.13"
dependencies = [
    "imagehash>=4.3.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "navegador: necesita la instancia de Brave con CDP en el puerto 9333",
]
